<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>阿杜 WebRTC 实时语音</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101318;
    --panel: #171c23;
    --panel2: #202732;
    --line: #313a47;
    --text: #edf4fb;
    --muted: #9ba9b8;
    --green: #66e0ad;
    --blue: #86a9ff;
    --amber: #eebd73;
    --red: #ff7188;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: #11151b;
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--muted); }
  .dot.on { background: var(--green); box-shadow: 0 0 0 4px rgba(102,224,173,.13); }
  .dot.busy { background: var(--amber); box-shadow: 0 0 0 4px rgba(238,189,115,.13); }
  main {
    display: grid;
    grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
    gap: 14px;
    padding: 14px;
  }
  section {
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }
  .controls { padding: 14px; }
  label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
  input {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #0d1117;
    color: var(--text);
    outline: none;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 12px;
  }
  button {
    min-height: 38px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel2);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: #26513f; border-color: rgba(102,224,173,.45); }
  button.warn { background: #4f3d23; border-color: rgba(238,189,115,.45); }
  button.danger { background: #512630; border-color: rgba(255,113,136,.45); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .meter { height: 7px; margin-top: 14px; border-radius: 999px; background: #0b0f14; overflow: hidden; }
  .meter i {
    display: block;
    height: 100%;
    width: calc(var(--level, 0) * 100%);
    background: linear-gradient(90deg, var(--green), var(--blue));
    transition: width 80ms linear;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 12px;
  }
  .metric {
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #12171e;
  }
  .metric span { display: block; color: var(--muted); font-size: 11px; }
  .metric strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conversation {
    display: grid;
    grid-template-rows: auto 1fr;
    min-height: calc(100vh - 92px);
  }
  .now { padding: 14px; border-bottom: 1px solid var(--line); background: #141922; }
  .subtitle { min-height: 38px; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
  .assistant { min-height: 28px; color: #dce8f7; overflow-wrap: anywhere; }
  .events { padding: 10px; overflow: auto; }
  .event {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 10px;
    padding: 8px 6px;
    border-bottom: 1px solid rgba(49,58,71,.65);
  }
  .event code { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .event div { min-width: 0; overflow-wrap: anywhere; color: #d7e1ed; }
  @media (max-width: 840px) {
    header { align-items: flex-start; flex-direction: column; }
    main { grid-template-columns: 1fr; }
    .conversation { min-height: 520px; }
  }
</style>
</head>
<body>
<header>
  <h1>阿杜 WebRTC 实时语音</h1>
  <div class="status"><i id="dot" class="dot"></i><span id="status">未连接</span></div>
</header>
<main>
  <section class="controls">
    <label for="backend">后端公网地址</label>
    <input id="backend" spellcheck="false" autocomplete="off" />
    <div class="buttons">
      <button id="connect" class="primary">连接</button>
      <button id="disconnect" disabled>断开</button>
      <button id="interrupt" class="warn" disabled>打断</button>
      <button id="finish" class="danger" disabled>结束</button>
    </div>
    <div class="meter"><i id="meter"></i></div>
    <div class="metrics">
      <div class="metric"><span>回合</span><strong id="round">-</strong></div>
      <div class="metric"><span>路由</span><strong id="route">-</strong></div>
      <div class="metric"><span>首音频</span><strong id="first">-</strong></div>
      <div class="metric"><span>总耗时</span><strong id="total">-</strong></div>
    </div>
  </section>
  <section class="conversation">
    <div class="now">
      <div id="subtitle" class="subtitle">连接后直接说话</div>
      <div id="assistant" class="assistant"></div>
      <div id="diagnostic" class="assistant"></div>
    </div>
    <div id="events" class="events"></div>
  </section>
</main>
<script>
  window.__aduWebrtcClientLoaded = false;
  function aduDiagnostic(text) {
    var el = document.getElementById("diagnostic");
    if (el) el.textContent = text || "";
  }
  window.addEventListener("error", function (event) {
    aduDiagnostic("页面脚本错误：" + (event.message || "unknown"));
  });
  window.addEventListener("unhandledrejection", function (event) {
    var reason = event.reason && (event.reason.message || event.reason);
    aduDiagnostic("连接错误：" + (reason || "unknown"));
  });
  document.getElementById("connect").addEventListener("click", function () {
    setTimeout(function () {
      if (!window.__aduWebrtcClientLoaded) {
        aduDiagnostic("前端脚本没有加载成功，请刷新页面或清空浏览器缓存。");
      }
    }, 150);
  }, true);
</script>
<script type="module" src="./webrtc-client.js?v=20260801-4"></script>
</body>
</html>
